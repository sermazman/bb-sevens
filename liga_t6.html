<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga BB Sevens T6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d1014; --panel:#151a21; --panel2:#1b222b; --line:#2a323e;
  --text:#e9ecf0; --muted:#8c97a6; --good:#3fb97b; --bad:#e5534b; --warn:#e3b341;
  --accent:#b30000; --accent-ink:#ffffff;
  --f-title:'Anton',Impact,sans-serif; --f-ui:'Oswald',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:400}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 64px}

/* barra superior */
.topbar{background:var(--panel);border-bottom:3px solid var(--accent)}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{font-family:var(--f-title);font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-ui);font-size:13px;letter-spacing:.14em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.15)}
.btn.small{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* vacío / carga */
.drop{margin-top:48px;border:2px dashed var(--line);border-radius:10px;padding:56px 24px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--text)}
.drop h2{font-family:var(--f-title);font-size:30px;color:var(--text);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}

/* cabecera de equipo */
.teamhead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:24px 0 16px}
.badge-team{background:var(--accent);color:var(--accent-ink);font-family:var(--f-title);font-size:32px;text-transform:uppercase;letter-spacing:.04em;padding:6px 18px;border-radius:6px}
.race{color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600;margin-top:2px}
.neg{color:var(--bad)}

/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}

/* tablas */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel2)}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono)}
td.skills{white-space:normal;text-align:left;min-width:170px;max-width:230px;color:#c7ced8;font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.out{color:var(--bad);border-color:var(--bad)}
tr.out td{opacity:.6}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
input[type=number]{font-family:var(--f-mono);text-align:right}
td input[type=number]{width:64px}
td.price input{width:92px}
td select{width:auto;min-width:170px}
textarea{resize:vertical;min-height:60px}

/* formularios */
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0 0 16px;padding:14px 16px}
legend{padding:0 8px;font-family:var(--f-title);letter-spacing:.06em;text-transform:uppercase;font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label.f{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label.f>input,label.f>select{margin-top:4px;color:var(--text);text-transform:none;letter-spacing:0;font-size:16px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.warn{color:var(--warn)}
.sum{font-family:var(--f-mono)}
.stat-table td:first-child{text-align:left}

/* historial / retirados */

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{font-family:var(--f-title);font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.res{font-family:var(--f-mono);font-size:18px}
.res.win{color:var(--good)} .res.loss{color:var(--bad)} .res.draw{color:var(--warn)}

.meta{color:var(--muted);font-size:14px;margin-top:4px}

/* equipo */

.stepper{display:flex;align-items:center;gap:8px;font-family:var(--f-mono)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
dl.calc{margin:0}
dl.calc div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
dl.calc div:last-child{border-bottom:0}
dl.calc dt{color:var(--muted)} dl.calc dd{margin:0;font-family:var(--f-mono)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:8px;z-index:10;max-width:90vw}
.toast[hidden]{display:none}
.banner{background:#2a2312;border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.btn.accent{border-color:var(--accent)}
.mvtitle{font-family:var(--f-title);font-size:30px;letter-spacing:.04em;text-transform:uppercase}
fieldset{min-width:0}

.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;margin:2px 4px 2px 0;background:var(--panel2)}

.tag .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 6px}
td.impcell{min-width:210px;white-space:normal}

.banner.bad{background:#2a1212;border-color:var(--bad);color:var(--bad)}

#impDlg .grid{margin-top:10px}

[hidden]{display:none!important}

a{color:inherit}
a:hover{text-decoration:underline}

.draftcell{font-family:var(--f-mono);font-weight:600;color:var(--warn)}

.tcard .btn{text-decoration:none;display:inline-block}

/* crónica de partido */
.rhead{font-family:var(--f-title);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center;margin:8px 0 12px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 16px;margin-bottom:16px}
.mteam{text-align:center;border-top:5px solid var(--tc);padding-top:12px}
.mteam .lgb{height:84px;width:auto;max-width:120px;object-fit:contain;display:block;margin:0 auto 6px}
.mname{font-family:var(--f-title);font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.mname a{color:inherit;text-decoration:none}
.bigscore{text-align:center;font-family:var(--f-title);font-size:64px;line-height:1;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:center;max-width:240px}
.bigscore b{color:var(--muted);font-weight:400}
.bigscore .verdict{flex-basis:100%;font-family:var(--f-body,inherit);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.srow{display:grid;grid-template-columns:34px 1fr 150px 1fr 34px;gap:8px;align-items:center;padding:5px 0}
.srow .sv{font-family:var(--f-mono);font-weight:600;text-align:center}
.srow .sl{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sbar{display:flex;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.sbar.l{justify-content:flex-end}
.sbar i{display:block;height:100%}
.hl{list-style:none;display:grid;gap:6px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;letter-spacing:.04em;white-space:nowrap}
.chip.gold{background:#8a6d1a33;border-color:#c9a227;color:#e5c24a}.chip.good{border-color:#3a9a5b;color:#6fd08f}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.warn{border-color:var(--warn);color:var(--warn)}
.msides{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.mside{border-top:5px solid var(--tc)}.mside h3{margin:10px 0}.mside .lg{height:28px}
td.wrap{white-space:normal;min-width:150px}
@media (max-width:760px){.scoreboard{grid-template-columns:1fr}.msides{grid-template-columns:1fr}.bigscore{max-width:none}.srow{grid-template-columns:28px 1fr 96px 1fr 28px}}
.report .card{margin-bottom:16px}td.wrap{vertical-align:middle}

.mcard{display:grid;grid-template-columns:auto auto auto auto auto;justify-content:center;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;color:var(--text);text-decoration:none;margin-bottom:10px;transition:border-color .15s,transform .15s}
.mcard:hover,.mcard:focus-visible{border-color:var(--accent);transform:translateY(-1px)}
.mlogo{width:88px;height:72px;display:flex;align-items:center;justify-content:center}
.mlogo .lgm{max-height:72px;max-width:88px;width:auto;height:auto;object-fit:contain}
.mdot{width:44px;height:44px;border-radius:50%;display:block}
.minfo{min-width:0;max-width:260px}.minfo.r{text-align:right}
.mn{font-family:var(--f-title);font-size:24px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;overflow-wrap:anywhere}
.mscore{text-align:center;min-width:150px}
.mscore .sc{font-family:var(--f-title);font-size:54px;line-height:1;display:flex;gap:12px;justify-content:center;align-items:baseline}
.mscore .sc b{color:var(--muted);font-weight:400}
.mcta{margin-top:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-link,var(--muted));border-bottom:1px solid var(--line);display:inline-block}
.mcard:hover .mcta{color:var(--text);border-color:var(--accent)}
.mid{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
@media (max-width:700px){.mcard{grid-template-columns:56px 1fr 56px;justify-content:stretch;gap:8px 10px;padding:12px}.mcard .mscore{grid-column:1/-1;grid-row:2;min-width:0}.mcard>.mlogo:first-child{grid-row:1;grid-column:1}.mcard>.minfo.r{grid-column:2;grid-row:1;text-align:left}.mcard>.minfo:not(.r){grid-column:2;grid-row:3;text-align:left}.mcard>.mlogo:last-child{grid-column:1;grid-row:3}.mlogo{width:56px;height:48px}.mlogo .lgm{max-height:48px;max-width:56px}.mn{font-size:18px}}

table.standings .c-pct{color:#ff5a52}
table.standings .c-tie{color:#ff9f43}

.sortbtn{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}

.calavbox{max-width:560px;margin:34px auto 10px}

.pobox{max-width:900px;margin:34px auto 0}

.pogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.povs{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}

.vs{font-family:var(--f-title);color:var(--muted);letter-spacing:.1em}
.benef{margin-top:12px}.benef h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}

<body>
<header class="topbar"><div class="wrap">
  <div class="brand">Liga Blood Bowl Sevens <small>Temporada 6 · vista pública</small></div>
  <div class="actions">
    <button class="btn" id="reloadBtn" type="button">Actualizar</button>
    <button class="btn primary" id="zipBtn" type="button">Descargar todos los equipos (.zip)</button>
  </div>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <nav class="tabs" id="mainTabs" role="tablist"></nav>
  <section id="view"></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const REPO={owner:'sermazman',repo:'bb-sevens',branch:'main',folder:'liga/t6/equipos'};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-ES');
const sgn=n=>(n>0?'+':'')+n;
const STAT_COLS=[['sprints','ESP'],['passes','CP'],['touchdowns','TD'],['deflections','DES'],['interceptions','INT'],['lightInjuries','HL'],['seriousInjuries','HG'],['deaths','RIP'],['mvp','MVP']];
const INJURY_LABEL={knockedOut:'Inconsciente',lightInjury:'Herido leve',seriousInjury:'Herido grave',dead:'Muerto'};
const IMPROVEMENT_COSTS={1:{pr:3,pc:6,sr:6,sc:12,st:18},2:{pr:4,pc:8,sr:8,sc:14,st:20},3:{pr:6,pc:12,sr:12,sc:18,st:24},4:{pr:8,pc:16,sr:16,sc:22,st:28},5:{pr:10,pc:20,sr:20,sc:26,st:32},6:{pr:15,pc:30,sr:30,sc:40,st:50}};
const STAT_LABEL={ma:'MO+',av:'AR+',ag:'AG−',pa:'PA−',st:'FU+'};
const DEFAULT_PRICES={dedicatedFan:20000,cheerleader:20000,assistantCoach:20000,apothecary:null,bribe:100000};
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const impText=im=>im.skill?im.skill:((STAT_LABEL[im.attribute]||im.attribute)+' (característica)');
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,4500)};
function textInk(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return'#fff';const n=parseInt(m[1],16);return(((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000)>=150?'#111':'#fff'}
const colorOf=d=>/^#[0-9a-f]{6}$/i.test(d.color||'')?d.color:'#b30000';
const inkOf=d=>d.textColor&&d.textColor!=='auto'?d.textColor:textInk(colorOf(d));

let LOAD_TS=Date.now();
let teams=[];          // {file, name, text, doc}
let skipped=[];
let ui={tab:'standings', team:null, match:null, teamTab:'roster', sort:null};

/* ---------- cálculos (los mismos que el gestor) ---------- */
const impCost=(im,i)=>{const r=IMPROVEMENT_COSTS[im.order||i+1];if(!r)return 0;return im.category==='stat'?r.st:r[(im.category==='primary'?'p':'s')+(im.selection==='random'?'r':'c')]};
const sppSpent=p=>(p.progression.improvements||[]).reduce((t,i,ix)=>t+impCost(i,ix),0);
const impValue=p=>(p.progression.improvements||[]).concat(p.progression.draftPayments||[]).reduce((t,i)=>t+(i.valueExtra||0),0);
const skillCount=p=>(p.progression.improvements||[]).filter(i=>i.skill).length;
const DRAFT_BONUS=15000;
const fansTotal=l=>(l.matches||[]).reduce((f,m)=>Math.min(5,Math.max(1,f+(m.dedicatedFansGained||0))),1);
function totals(d,reg){
  const m=reg?d.league.matches.filter(x=>!(x.round>ROUND_MAX)):d.league.matches,sum=f=>m.reduce((t,x)=>t+(f(x)||0),0),st=x=>x.statistics||{};
  const r={played:m.length,won:m.filter(x=>x.result.outcome==='win').length,drawn:m.filter(x=>x.result.outcome==='draw').length,lost:m.filter(x=>x.result.outcome==='loss').length};
  r.tdFor=sum(x=>x.result.teamScore);r.tdAgainst=sum(x=>x.result.opponentScore);
  for(const k of['lightInjuries','seriousInjuries','deaths','sentOff','skulls','ones']){r[k+'For']=sum(x=>st(x)[k+'For']);r[k+'Against']=sum(x=>st(x)[k+'Against'])}
  r.casFor=r.lightInjuriesFor+r.seriousInjuriesFor+r.deathsFor;r.casAgainst=r.lightInjuriesAgainst+r.seriousInjuriesAgainst+r.deathsAgainst;
  r.pct=r.played?(r.won+0.5*r.drawn)/r.played:0;
  r.calav=r.skullsFor+r.onesFor;
  r.a0=m.filter(x=>x.result.opponentScore===0).length;
  r.dif3=m.filter(x=>x.result.teamScore-x.result.opponentScore>=3).length;
  r.h3=m.filter(x=>(st(x).lightInjuriesFor||0)+(st(x).seriousInjuriesFor||0)+(st(x).deathsFor||0)>=3).length;
  r.tie=r.calav*0.5+r.dif3+r.a0+r.h3;
  r.spp=sum(x=>(x.playerEvents||[]).reduce((t,e)=>t+(e.sppEarned||0),0));
  r.earnings=sum(x=>x.earnings);r.spent=sum(x=>x.treasurySpent);r.fansGained=sum(x=>x.dedicatedFansGained);
  return r;
}
function economy(d){
  const l=d.league,pr=Object.assign({},DEFAULT_PRICES,(l.economy||{}).prices),s=l.staff||{},t=totals(d);
  const rerolls=(d.staff&&d.staff.rerolls&&d.staff.rerolls.total)||0;
  const staffCost=(s.cheerleaders||0)*pr.cheerleader+(s.assistantCoaches||0)*pr.assistantCoach+(s.apothecary||0)*(pr.apothecary||0)+(s.bribes||0)*pr.bribe;
  const playersBase=l.players.reduce((a,p)=>a+(p.price||0),0),playersExtra=l.players.reduce((a,p)=>a+impValue(p),0);
  const deadCost = l.retiredPlayers.filter(p=>p.reason==='dead'||p.reason==='drafted').reduce((a,p)=>a+(p.price||0),0);
  const valuePaid=l.players.concat(l.retiredPlayers).reduce((a,p)=>a+((p.progression.draftPayments||[]).reduce((b,x)=>b+(x.paid||0),0)),0);
  const teamCost=staffCost+rerolls+playersBase+playersExtra;
  const teamValue=staffCost+rerolls+l.players.filter(p=>p.status!=='missNextGame').reduce((a,p)=>a+(p.price||0)+impValue(p),0);
  const start=(l.economy||{}).startingTreasury||0;
  return{rerolls,staffCost,playersBase,playersExtra,deadCost,teamCost,teamValue,start,treasury:start+t.earnings-t.spent-teamCost+playersExtra-deadCost-valuePaid,valuePaid,fans:fansTotal(l),t};
}

/* ---------- carga ---------- */
const rawUrl=f=>`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${REPO.folder}/${encodeURIComponent(f)}`;
async function getText(file){
  const bust='?v='+Date.now();
  for(const u of[`${REPO.folder}/${encodeURIComponent(file)}${bust}`,rawUrl(file)+bust]){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.text()}catch(e){}
  }
  throw new Error('No se pudo leer '+file);
}
async function listFiles(){
  const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.folder}?ref=${REPO.branch}`;
  const r=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status===403?'GitHub ha limitado las consultas desde tu conexión. Prueba en unos minutos.':'No se pudo leer la lista de equipos ('+r.status+').');
  return(await r.json()).filter(x=>x.type==='file'&&/\.json$/i.test(x.name)).map(x=>x.name);
}
async function loadAll(){
  $('#view').innerHTML='<div class="empty">Cargando equipos…</div>';$('#banner').innerHTML='';
  teams=[];skipped=[];LOAD_TS=Date.now();
  try{
    const files=await listFiles();
    await Promise.all(files.map(async f=>{
      try{
        const text=await getText(f),doc=JSON.parse(text);
        if(!doc.league||doc.league.schemaVersion!==2){skipped.push(f);return}
        const l=doc.league;l.players=l.players||[];l.matches=l.matches||[];l.retiredPlayers=l.retiredPlayers||[];l.staff=l.staff||{};l.economy=l.economy||{};
        l.players.concat(l.retiredPlayers).forEach(p=>{p.progression=p.progression||{};p.progression.improvements=p.progression.improvements||[];p.statistics=p.statistics||{}});
        teams.push({file:f,name:doc.teamName||f.replace(/\.json$/i,''),text,doc});
      }catch(e){skipped.push(f)}
    }));
    teams.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  }catch(e){$('#view').innerHTML='';$('#banner').innerHTML=`<div class="banner bad">${esc(e.message)}</div>`;return}
  if(skipped.length)$('#banner').innerHTML=`<div class="banner">No se han podido mostrar: ${skipped.map(esc).join(', ')}</div>`;
  fromHash();render();
}

/* ---------- logos (PNG junto al JSON del equipo; solo se muestran, con tamaño limitado) ---------- */
const logoName=d=>{const n=d&&d.league&&d.league.logo;return /^[\w.-]+\.png$/i.test(n||'')?n:null};
const rawLogo=n=>`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${REPO.folder}/${encodeURIComponent(n)}?v=${LOAD_TS}`;
function logoImg(t,cls){const n=logoName(t.doc);return n?`<img class="${cls}" src="${REPO.folder}/${encodeURIComponent(n)}?v=${LOAD_TS}" alt="" onerror="logoFallback(this,'${n}')">`:''}
function logoFallback(im,n){if(im.dataset.fb){im.remove();return}im.dataset.fb='1';im.src=rawLogo(n)}
async function fetchLogo(t){
  const n=logoName(t.doc);if(!n)return null;
  for(const u of[`${REPO.folder}/${encodeURIComponent(n)}?v=${LOAD_TS}`,rawLogo(n)]){
    try{const r=await fetch(u);if(r.ok){const b=await r.blob();return await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(new Blob([b],{type:'image/png'}))})}}catch(e){}
  }
  return null;
}

/* ---------- descargas ---------- */
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadTeam(file){const t=teams.find(x=>x.file===file);if(t)saveBlob(new Blob([t.text],{type:'application/json'}),t.file)}
async function downloadZip(){
  if(!teams.length)return toast('No hay equipos que descargar.');
  try{
    if(!window.JSZip)await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
    const z=new JSZip();teams.forEach(t=>z.file(t.file,t.text));
    saveBlob(await z.generateAsync({type:'blob'}),'equipos_liga_t6.zip');
  }catch(e){toast('No se pudo crear el zip. Descarga los equipos uno a uno.')}
}

/* ---------- vistas ---------- */
const ROUND_MAX=10;
const roundLabel=n=>n>=1&&n<=ROUND_MAX?`Jornada ${n}`:n===ROUND_MAX+1?'PlayOff - Semifinal':n===ROUND_MAX+2?'PlayOff - Final':'—';
const MAIN_TABS=[['standings','Clasificación'],['teams','Equipos'],['matches','Partidos'],['hof','Hall of Fame']];
function render(){
  $('#mainTabs').innerHTML=MAIN_TABS.map(([id,l])=>`<button class="tab" role="tab" data-main="${id}" aria-selected="${ui.tab===id&&!ui.team}">${l}</button>`).join('');
  if(ui.match)return renderMatchReport();

  ui.team=null;

function badge(t){const d=t.doc;return`<span class="dot" style="background:${colorOf(d)}"></span>`}
const pctTxt=p=>(p*100).toFixed(1).replace('.',',')+' %';
const nflTxt=p=>p>=1?'1.00':p.toFixed(2).replace(/^0/,'');   /* estilo NFL: .50, .75, 1.00 */
const numTxt=n=>String(n).replace('.',',');
const QUALIFY=4;
/* columnas de la clasificación: [clave, cabecera, ayuda, valor, clase de color] */
const STD_COLS=[
  ['won','V','Partidos ganados',r=>r.x.won,''],
  ['lost','D','Partidos perdidos',r=>r.x.lost,''],
  ['drawn','E','Partidos empatados',r=>r.x.drawn,''],
  ['pct','%','Porcentaje de victorias = (V + E × 0,5) / PJ. Es lo primero que decide la clasificación',r=>r.x.pct,'c-pct'],
  ['played','PJ','Partidos jugados',r=>r.x.played,''],
  ['tie','≠','Primer desempate: calaverunos × 0,5 + Dif3 + A«0» + 3H',r=>r.x.tie,'c-tie'],
  ['tdFor','TD+','Touchdowns a favor',r=>r.x.tdFor,''],
  ['tdAgainst','TD−','Touchdowns en contra',r=>r.x.tdAgainst,''],
  ['tdd','Dif','Diferencia de TD',r=>r.tdd,''],
  ['calav','Calav.','Calaverunos: calaveras y unos naturales sacados',r=>r.x.calav,''],
  ['spp','PtsE','Puntos de estrellato (SPP ganados por los jugadores)',r=>r.x.spp,''],
  ['cas','HER','Heridas causadas (leves + graves + muertes)',r=>r.x.casFor,''],
  ['deaths','†','Muertes causadas',r=>r.x.deathsFor,''],
  ['dif3','Dif3','Victorias por 3 TD o más de diferencia',r=>r.x.dif3,'c-ext'],
  ['a0','A«0»','Partidos en que dejas al rival a 0',r=>r.x.a0,'c-ext'],
  ['h3','3H','Partidos en que causas 3 o más bajas',r=>r.x.h3,'c-ext']
];
function standingRows(){
  const rows=teams.map(t=>{const x=totals(t.doc,true);return{t,x,tdd:x.tdFor-x.tdAgainst}})
    .sort((a,b)=>b.x.pct-a.x.pct||b.x.tie-a.x.tie||b.x.calav-a.x.calav||b.tdd-a.tdd||b.x.spp-a.x.spp||a.t.name.localeCompare(b.t.name,'es'));
  rows.forEach((r,i)=>r.pos=i+1);   /* posición oficial, no cambia al reordenar la vista */
  return rows;
}
function renderStandings(){
  if(!teams.length){$('#view').innerHTML='<div class="empty">Todavía no hay equipos inscritos.</div>';return}
  const official=standingRows();
  let rows=official.slice();
  const sk=ui.sort&&ui.sort.key;
  if(sk){
    const dir=ui.sort.dir==='asc'?1:-1;
    if(sk==='name') rows.sort((a,b)=>dir*a.t.name.localeCompare(b.t.name,'es')||a.pos-b.pos);
    else{ const col=STD_COLS.find(c=>c[0]===sk); rows.sort((a,b)=>dir*(col[3](a)-col[3](b))||a.pos-b.pos); }
  }
  const mark=k=>sk===k?(ui.sort.dir==='asc'?' ▲':' ▼'):'';
  const th=c=>`<th class="${c[4]}" title="${c[2]}"><button type="button" class="sortbtn" data-sort="${c[0]}">${c[1]}${mark(c[0])}</button></th>`;
  const cell=(c,r)=>{const val=c[3](r);const txt=c[0]==='pct'?nflTxt(val):c[0]==='tie'?numTxt(val):c[0]==='tdd'?sgn(val):val;return`<td class="num ${c[4]}">${c[4]==='c-pct'||c[4]==='c-tie'?`<strong>${txt}</strong>`:txt}</td>`};
  const ord=!sk;
  $('#view').innerHTML=`<div class="tscroll"><table class="standings"><thead><tr><th>Pos</th><th class="l"><button type="button" class="sortbtn l" data-sort="name">Equipo${mark('name')}</button></th>${STD_COLS.map(th).join('')}</tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="${ord&&r.pos===QUALIFY&&rows.length>QUALIFY?'cut':''}${r.pos<=QUALIFY?' in':''}"><td class="num">${r.pos}</td><td class="l tcell"><a href="#team=${encodeURIComponent(r.t.file)}" class="tlink"><span class="tlogo">${logoImg(r.t,'lgs')||badge(r.t)}</span><span class="ttext"><strong class="tname">${esc(r.t.name)}</strong><span class="trace">${esc(r.t.doc.race||'')}</span></span></a></td>${STD_COLS.map(c=>cell(c,r)).join('')}</tr>`).join('')}
  </tbody></table></div>
  ${sk?`<p class="hint"><button type="button" class="btn small" data-sort="">Volver al orden oficial</button> Estás viendo la tabla ordenada por otra columna; «Pos» sigue siendo la clasificación oficial.</p>`:''}
  <p class="hint">La clasificación se ordena por <strong class="c-pct">%</strong> de victorias, calculado como (V + E × 0,5) / PJ, al estilo NFL. Si hay empate, por orden: <strong class="c-tie">≠</strong> (puntos de desempate), calaverunos, diferencia de TD y puntos de estrellato. <strong class="c-tie">≠</strong> = calaverunos × 0,5 + <span class="c-ext">Dif3</span> (victoria por 3 TD o más) + <span class="c-ext">A«0»</span> (rival a 0 TD) + <span class="c-ext">3H</span> (3 o más bajas causadas), sumado partido a partido. Pasan a la fase final los ${QUALIFY} primeros. Los partidos de PlayOff no cuentan para esta tabla. Puedes ordenar por cualquier columna pulsando su cabecera.</p>
  ${playoffsHTML(official)}
  ${calavTableHTML()}`;
}
/* ---------- Hall of Fame ---------- */
const HOF_TABLES=[
  ['lightInjuries','Heridos leves','lightInjuries'],['touchdowns','Anotaciones','touchdowns'],
  ['seriousInjuries','Heridos graves','seriousInjuries'],['passes','Pases completados','passes'],
  ['deaths','Muertos','deaths'],['mvp','MVP del partido','mvp']
];
function hofPlayers(){
  const out=[];
  for(const t of teams){
    const l=t.doc.league, col=colorOf(t.doc), ink=inkOf(t.doc);
    const keyOf=(sk,pos)=>{const k=(sk||[]).find(s=>/\s-\s/.test(s));return k||pos||''};
    l.players.forEach(lp=>{const tp=t.doc.players.find(p=>p.num===lp.num); if(!tp) return;
      out.push({name:tp.name,key:keyOf(tp.skills,tp.position),team:t,col,ink,state:'',st:lp.statistics||{},spp:(lp.progression||{}).sppTotal||0});});
    (l.retiredPlayers||[]).forEach(p=>out.push({name:p.name,key:keyOf(p.skills,p.position),team:t,col,ink,state:p.reason==='drafted'?'Drafteado':p.reason==='dead'?'Muerto':'',st:p.statistics||{},spp:(p.progression||{}).sppTotal||0}));
  }
  return out;
}
function hofTable(title,rows,valKey,withExtra){
  /* posiciones con empates: 1, 1, 3… */
  let last=null,pos=0;
  const body=rows.map((r,i)=>{ if(r.v!==last){pos=i+1;last=r.v}
    return`<tr><td class="num">${pos}</td><td class="l"><a href="#team=${encodeURIComponent(r.p.team.file)}" class="hofname"><strong>${esc(r.p.name)}</strong>${r.p.state?` <span class="hofstate">(${r.p.state})</span>`:''}</a></td>${withExtra?`<td class="l hofkey">${esc(r.p.key)}</td>`:''}<td class="l"><span class="tchip" style="background:${r.p.col};color:${r.p.ink}">${esc(r.p.team.name)}</span></td>${withExtra?`<td class="hofcat" title="Categoría (pendiente de definir)">—</td>`:''}<td class="num"><strong>${r.v}</strong></td></tr>`; }).join('');
  return`<section class="hofbox"><h2 class="round">${title}</h2>${rows.length?`<div class="tscroll"><table class="hoftable"><thead><tr><th>Pos</th><th class="l">Nombre</th>${withExtra?'<th class="l">Posición</th>':''}<th class="l">Equipo</th>${withExtra?'<th>Categoría</th>':''}<th>${withExtra?'PE total':'Total'}</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="hint">Todavía no hay nadie en esta tabla.</p>'}</section>`;
}
function renderHof(){
  if(!teams.length){$('#view').innerHTML='<div class="empty">Todavía no hay equipos inscritos.</div>';return}
  const all=hofPlayers();
  const rank=(getv)=>all.map(p=>({p,v:getv(p)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v||a.p.name.localeCompare(b.p.name,'es'));
  $('#view').innerHTML=`<div class="hofintro"><h2 class="round">Hall of Fame</h2><p class="hint" style="text-align:center">Los mejores jugadores de la liga. Incluye a los jugadores muertos o drafteados, que se marcan junto al nombre.</p></div>
  ${hofTable('Puntos de estrellato',rank(p=>p.spp),'spp',true)}
  <div class="hofgrid">${HOF_TABLES.map(([id,title,k])=>hofTable(title,rank(p=>p.st[k]||0),k,false)).join('')}</div>`;
}

function allMatches(){
  const seen=new Set(),out=[];
  for(const t of teams)for(const m of t.doc.league.matches){
    const pair=[t.name,m.opponent.teamName].sort().join('|'),key=m.id+'|'+pair;
    if(seen.has(key)&&m.homeAway!=='home')continue;
    if(seen.has(key)){const i=out.findIndex(o=>o.key===key);if(i>=0)out.splice(i,1)}
    seen.add(key);
    const home=m.homeAway==='away'?{name:m.opponent.teamName,score:m.result.opponentScore,file:null}:{name:t.name,score:m.result.teamScore,file:t.file};
    const away=m.homeAway==='away'?{name:t.name,score:m.result.teamScore,file:t.file}:{name:m.opponent.teamName,score:m.result.opponentScore,file:null};
    out.push({key,id:m.id,round:m.round||0,home,away,team:t,m});
  }
  return out.sort((a,b)=>b.round-a.round||a.id.localeCompare(b.id));
}

function matchSides(key){
  const o=allMatches().find(x=>x.key===key); if(!o) return null;
  const mk=(side)=>{
    const t=teams.find(q=>q.name===side.name), other=side===o.home?o.away:o.home;
    const m=t&&t.doc.league.matches.find(x=>x.id===o.id&&x.opponent.teamName===other.name);
    return {name:side.name,score:side.score,t,m,d:t&&t.doc};
  };
  const h=mk(o.home), a=mk(o.away);
  /* si falta el archivo de un equipo, se reconstruye lo básico con los datos del otro */
  if(!h.m&&a.m){ h.m={result:{teamScore:a.m.result.opponentScore,opponentScore:a.m.result.teamScore},statistics:{lightInjuriesFor:(a.m.statistics||{}).lightInjuriesAgainst,seriousInjuriesFor:(a.m.statistics||{}).seriousInjuriesAgainst,deathsFor:(a.m.statistics||{}).deathsAgainst,sentOffFor:(a.m.statistics||{}).sentOffAgainst,skullsFor:(a.m.statistics||{}).skullsAgainst,onesFor:(a.m.statistics||{}).onesAgainst},playerEvents:[],partial:true}; }
  if(!a.m&&h.m){ a.m={result:{teamScore:h.m.result.opponentScore,opponentScore:h.m.result.teamScore},statistics:{lightInjuriesFor:(h.m.statistics||{}).lightInjuriesAgainst,seriousInjuriesFor:(h.m.statistics||{}).seriousInjuriesAgainst,deathsFor:(h.m.statistics||{}).deathsAgainst,sentOffFor:(h.m.statistics||{}).sentOffAgainst,skullsFor:(h.m.statistics||{}).skullsAgainst,onesFor:(h.m.statistics||{}).onesAgainst},playerEvents:[],partial:true}; }
  return {o,h,a};
}
function evBadges(ev){
  const b=[];
  if(ev.mvp) b.push('<span class="chip gold">MVP</span>');
  if(ev.injurySuffered==='dead') b.push('<span class="chip bad">Muerto</span>');
  else if(ev.injurySuffered&&ev.injurySuffered!=='none') b.push(`<span class="chip warn">${INJURY_LABEL[ev.injurySuffered]||''}</span>`);
  if(ev.hatred) b.push(`<span class="chip">Gana Odio (${esc(ev.hatred)})</span>`);
  (ev.improvements||[]).forEach(im=>b.push(`<span class="chip good">Mejora: ${esc(impText(im))}</span>`));
  if(ev.draft==='drafted') b.push(`<span class="chip bad">Drafteado</span>`);
  if(ev.draft==='paidValue') b.push(`<span class="chip warn">Pagó ${fmt(ev.valuePaid)} (+${fmt(DRAFT_BONUS)} de valor)</span>`);
  return b.join(' ');
}

/* =========================================================
   Hoja de partido en PDF (formato de la hoja de roster del Excel)
   Necesita: DEFAULT_PRICES, fmt, colorOf-like (se calcula aquí). e = resultado de economy().
   ========================================================= */
async function ensureJsPDF(){
  if(window.jspdf) return window.jspdf.jsPDF;
  await new Promise((ok,ko)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar la librería de PDF (¿sin conexión?).'));
    document.head.appendChild(s);
  });
  return window.jspdf.jsPDF;
}
/* la clave del jugador es la habilidad con forma «Línea - Orc» */
function sheetSplitSkills(p){
  const sk=(p.skills||[]).slice(); let i=-1;
  sk.forEach((k,ix)=>{ if(/\s-\s/.test(k)) i=ix; });
  if(i<0) return {key:'',rest:sk};
  return {key:sk[i],rest:sk.filter((_,ix)=>ix!==i)};
}
function loadImgDims(dataUrl){

function skillAccess(race,pos){
  const rk=Object.keys(SKILL_ACCESS).find(k=>k.toLowerCase()===String(race||'').trim().toLowerCase()); if(!rk) return null;
  const r=SKILL_ACCESS[rk], pk=Object.keys(r).find(k=>k.toLowerCase()===String(pos||'').trim().toLowerCase()); if(!pk) return null;
  const L=['G','A','F','P','M','T']; let prim='',sec='';
  r[pk].split('').forEach((c,i)=>{ if(c==='P') prim+=L[i]; else if(c==='S') sec+=L[i]; });
  return {prim,sec};
}
