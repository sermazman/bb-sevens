<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga BB Sevens T6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d1014; --panel:#151a21; --panel2:#1b222b; --line:#2a323e;
  --text:#e9ecf0; --muted:#8c97a6; --good:#3fb97b; --bad:#e5534b; --warn:#e3b341;
  --accent:#b30000; --accent-ink:#ffffff;
  --f-title:'Anton',Impact,sans-serif; --f-ui:'Oswald',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:400}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 64px}

/* barra superior */
.topbar{background:var(--panel);border-bottom:3px solid var(--accent)}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{font-family:var(--f-title);font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-ui);font-size:13px;letter-spacing:.14em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.15)}
.btn.small{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* vacío / carga */
.drop{margin-top:48px;border:2px dashed var(--line);border-radius:10px;padding:56px 24px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--text)}
.drop h2{font-family:var(--f-title);font-size:30px;color:var(--text);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}

/* cabecera de equipo */
.teamhead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:24px 0 16px}
.badge-team{background:var(--accent);color:var(--accent-ink);font-family:var(--f-title);font-size:32px;text-transform:uppercase;letter-spacing:.04em;padding:6px 18px;border-radius:6px}
.race{color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600;margin-top:2px}
.neg{color:var(--bad)}

/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}

/* tablas */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel2)}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono)}
td.skills{white-space:normal;text-align:left;min-width:170px;max-width:230px;color:#c7ced8;font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.out{color:var(--bad);border-color:var(--bad)}
tr.out td{opacity:.6}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
input[type=number]{font-family:var(--f-mono);text-align:right}
td input[type=number]{width:64px}
td.price input{width:92px}
td select{width:auto;min-width:170px}
textarea{resize:vertical;min-height:60px}

/* formularios */
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0 0 16px;padding:14px 16px}
legend{padding:0 8px;font-family:var(--f-title);letter-spacing:.06em;text-transform:uppercase;font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label.f{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label.f>input,label.f>select{margin-top:4px;color:var(--text);text-transform:none;letter-spacing:0;font-size:16px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.warn{color:var(--warn)}
.sum{font-family:var(--f-mono)}
.stat-table td:first-child{text-align:left}
.stat-table input{width:80px}

/* historial / retirados */
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{font-family:var(--f-title);font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.res{font-family:var(--f-mono);font-size:18px}
.res.win{color:var(--good)} .res.loss{color:var(--bad)} .res.draw{color:var(--warn)}
.card ul{margin:8px 0 0;padding-left:18px;color:#c7ced8;font-size:15px}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* equipo */
.staffrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.staffrow:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:8px;font-family:var(--f-mono)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
dl.calc{margin:0}
dl.calc div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
dl.calc div:last-child{border-bottom:0}
dl.calc dt{color:var(--muted)} dl.calc dd{margin:0;font-family:var(--f-mono)}
dl.calc .total{font-weight:600}

.ghbar{background:var(--bg);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.ghbar .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:6px;padding-bottom:6px}
#ghStatus.ok{color:var(--good)} #ghStatus.bad{color:var(--bad)} #ghStatus.warn{color:var(--warn)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:20px;width:calc(100% - 32px);max-width:600px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-family:var(--f-title);text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin-bottom:6px}
code{font-family:var(--f-mono);font-size:.9em;color:#c7ced8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:8px;z-index:10;max-width:90vw}
.toast[hidden]{display:none}
.banner{background:#2a2312;border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.btn.accent{border-color:var(--accent)}
.mvtitle{font-family:var(--f-title);font-size:30px;letter-spacing:.04em;text-transform:uppercase}
fieldset{min-width:0}
#matchForm td input[type=number]{width:50px;padding:6px 4px}
#matchForm td select{width:124px;min-width:124px}
#matchForm td.impcell{min-width:170px}
fieldset.side{border-left:6px solid var(--tc,var(--accent))}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;margin:2px 4px 2px 0;background:var(--panel2)}
.tag small{color:var(--muted)}
.tag .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 6px}
td.impcell{min-width:210px;white-space:normal}
.newsk{color:var(--warn);font-weight:600}
.banner.bad{background:#2a1212;border-color:var(--bad);color:var(--bad)}
.banner ul{margin:6px 0 0;padding-left:18px}
#impDlg .grid{margin-top:10px}
#impDlg[open]{max-width:640px}
[hidden]{display:none!important}
@media (max-width:600px){.brand{font-size:22px}.badge-team{font-size:24px}.mvtitle{font-size:24px}}
a{color:inherit}
a:hover{text-decoration:underline}
.pill.draft{color:var(--warn);border-color:var(--warn)}
.draftcell{font-family:var(--f-mono);font-weight:600;color:var(--warn)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tcard .btn{text-decoration:none;display:inline-block}
h2.round{font-family:var(--f-title);text-transform:uppercase;letter-spacing:.06em;font-size:22px;margin:22px 0 10px}
td.l a{text-decoration:none}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand">Liga Blood Bowl Sevens <small>Temporada 6 · vista pública</small></div>
  <div class="actions">
    <button class="btn" id="reloadBtn" type="button">Actualizar</button>
    <button class="btn primary" id="zipBtn" type="button">Descargar todos los equipos (.zip)</button>
  </div>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <nav class="tabs" id="mainTabs" role="tablist"></nav>
  <section id="view"></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const REPO={owner:'sermazman',repo:'bb-sevens',branch:'main',folder:'liga/t6/equipos'};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-ES');
const sgn=n=>(n>0?'+':'')+n;
const STAT_COLS=[['sprints','ESP'],['passes','CP'],['touchdowns','TD'],['deflections','DES'],['interceptions','INT'],['lightInjuries','HL'],['seriousInjuries','HG'],['deaths','RIP'],['mvp','MVP']];
const INJURY_LABEL={knockedOut:'Inconsciente',lightInjury:'Herido leve',seriousInjury:'Herido grave',dead:'Muerto'};
const IMPROVEMENT_COSTS={1:{pr:3,pc:6,sr:6,sc:12,st:18},2:{pr:4,pc:8,sr:8,sc:14,st:20},3:{pr:6,pc:12,sr:12,sc:18,st:24},4:{pr:8,pc:16,sr:16,sc:22,st:28},5:{pr:10,pc:20,sr:20,sc:26,st:32},6:{pr:15,pc:30,sr:30,sc:40,st:50}};
const STAT_LABEL={ma:'MO+',av:'AR+',ag:'AG−',pa:'PA−',st:'FU+'};
const DEFAULT_PRICES={dedicatedFan:20000,cheerleader:20000,assistantCoach:20000,apothecary:null,bribe:100000};
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const impText=im=>im.skill?im.skill:((STAT_LABEL[im.attribute]||im.attribute)+' (característica)');
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,4500)};
function textInk(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return'#fff';const n=parseInt(m[1],16);return(((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000)>=150?'#111':'#fff'}
const colorOf=d=>/^#[0-9a-f]{6}$/i.test(d.color||'')?d.color:'#b30000';
const inkOf=d=>d.textColor&&d.textColor!=='auto'?d.textColor:textInk(colorOf(d));

let teams=[];          // {file, name, text, doc}
let skipped=[];
let ui={tab:'standings', team:null, teamTab:'roster'};

/* ---------- cálculos (los mismos que el gestor) ---------- */
const impCost=(im,i)=>{const r=IMPROVEMENT_COSTS[im.order||i+1];if(!r)return 0;return im.category==='stat'?r.st:r[(im.category==='primary'?'p':'s')+(im.selection==='random'?'r':'c')]};
const sppSpent=p=>(p.progression.improvements||[]).reduce((t,i,ix)=>t+impCost(i,ix),0);
const impValue=p=>(p.progression.improvements||[]).concat(p.progression.draftPayments||[]).reduce((t,i)=>t+(i.valueExtra||0),0);
const skillCount=p=>(p.progression.improvements||[]).filter(i=>i.skill).length;
const DRAFT_BONUS=15000;
function totals(d){
  const m=d.league.matches,sum=f=>m.reduce((t,x)=>t+(f(x)||0),0),st=x=>x.statistics||{};
  const r={played:m.length,won:m.filter(x=>x.result.outcome==='win').length,drawn:m.filter(x=>x.result.outcome==='draw').length,lost:m.filter(x=>x.result.outcome==='loss').length};
  r.tdFor=sum(x=>x.result.teamScore);r.tdAgainst=sum(x=>x.result.opponentScore);
  for(const k of['lightInjuries','seriousInjuries','deaths','sentOff']){r[k+'For']=sum(x=>st(x)[k+'For']);r[k+'Against']=sum(x=>st(x)[k+'Against'])}
  r.casFor=r.lightInjuriesFor+r.seriousInjuriesFor+r.deathsFor;r.casAgainst=r.lightInjuriesAgainst+r.seriousInjuriesAgainst+r.deathsAgainst;
  r.points=sum(x=>x.leaguePoints);r.earnings=sum(x=>x.earnings);r.spent=sum(x=>x.treasurySpent);r.fansGained=sum(x=>x.dedicatedFansGained);
  return r;
}
function economy(d){
  const l=d.league,pr=Object.assign({},DEFAULT_PRICES,(l.economy||{}).prices),s=l.staff||{},t=totals(d);
  const rerolls=(d.staff&&d.staff.rerolls&&d.staff.rerolls.total)||0;
  const staffCost=Math.max(0,(s.dedicatedFans||1)-1)*pr.dedicatedFan+(s.cheerleaders||0)*pr.cheerleader+(s.assistantCoaches||0)*pr.assistantCoach+(s.apothecary||0)*(pr.apothecary||0)+(s.bribes||0)*pr.bribe;
  const playersBase=l.players.reduce((a,p)=>a+(p.price||0),0),playersExtra=l.players.reduce((a,p)=>a+impValue(p),0);
  const deadCost = l.retiredPlayers.filter(p=>p.reason==='dead'||p.reason==='drafted').reduce((a,p)=>a+(p.price||0)+impValue(p),0);
  const valuePaid=l.players.concat(l.retiredPlayers).reduce((a,p)=>a+((p.progression.draftPayments||[]).reduce((b,x)=>b+(x.paid||0),0)),0);
  const teamCost=staffCost+rerolls+playersBase+playersExtra;
  const teamValue=staffCost+rerolls+l.players.filter(p=>p.status!=='missNextGame').reduce((a,p)=>a+(p.price||0)+impValue(p),0);
  const start=(l.economy||{}).startingTreasury||0;
  return{rerolls,staffCost,playersBase,playersExtra,deadCost,teamCost,teamValue,start,treasury:start+t.earnings-t.spent-teamCost+playersExtra-deadCost-valuePaid,valuePaid,fans:(s.dedicatedFans||1)+t.fansGained,t};
}

/* ---------- carga ---------- */
const rawUrl=f=>`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${REPO.folder}/${encodeURIComponent(f)}`;
async function getText(file){
  const bust='?v='+Date.now();
  for(const u of[`${REPO.folder}/${encodeURIComponent(file)}${bust}`,rawUrl(file)+bust]){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.text()}catch(e){}
  }
  throw new Error('No se pudo leer '+file);
}
async function listFiles(){
  const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.folder}?ref=${REPO.branch}`;
  const r=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status===403?'GitHub ha limitado las consultas desde tu conexión. Prueba en unos minutos.':'No se pudo leer la lista de equipos ('+r.status+').');
  return(await r.json()).filter(x=>x.type==='file'&&/\.json$/i.test(x.name)).map(x=>x.name);
}
async function loadAll(){
  $('#view').innerHTML='<div class="empty">Cargando equipos…</div>';$('#banner').innerHTML='';
  teams=[];skipped=[];
  try{
    const files=await listFiles();
    await Promise.all(files.map(async f=>{
      try{
        const text=await getText(f),doc=JSON.parse(text);
        if(!doc.league||doc.league.schemaVersion!==2){skipped.push(f);return}
        const l=doc.league;l.players=l.players||[];l.matches=l.matches||[];l.retiredPlayers=l.retiredPlayers||[];l.staff=l.staff||{};l.economy=l.economy||{};
        l.players.concat(l.retiredPlayers).forEach(p=>{p.progression=p.progression||{};p.progression.improvements=p.progression.improvements||[];p.statistics=p.statistics||{}});
        teams.push({file:f,name:doc.teamName||f.replace(/\.json$/i,''),text,doc});
      }catch(e){skipped.push(f)}
    }));
    teams.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  }catch(e){$('#view').innerHTML='';$('#banner').innerHTML=`<div class="banner bad">${esc(e.message)}</div>`;return}
  if(skipped.length)$('#banner').innerHTML=`<div class="banner">No se han podido mostrar: ${skipped.map(esc).join(', ')}</div>`;
  fromHash();render();
}

/* ---------- descargas ---------- */
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadTeam(file){const t=teams.find(x=>x.file===file);if(t)saveBlob(new Blob([t.text],{type:'application/json'}),t.file)}
async function downloadZip(){
  if(!teams.length)return toast('No hay equipos que descargar.');
  try{
    if(!window.JSZip)await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
    const z=new JSZip();teams.forEach(t=>z.file(t.file,t.text));
    saveBlob(await z.generateAsync({type:'blob'}),'equipos_liga_t6.zip');
  }catch(e){toast('No se pudo crear el zip. Descarga los equipos uno a uno.')}
}

/* ---------- vistas ---------- */
const MAIN_TABS=[['standings','Clasificación'],['teams','Equipos'],['matches','Partidos']];
function render(){
  $('#mainTabs').innerHTML=MAIN_TABS.map(([id,l])=>`<button class="tab" role="tab" data-main="${id}" aria-selected="${ui.tab===id&&!ui.team}">${l}</button>`).join('');
  if(ui.team&&teams.find(t=>t.file===ui.team))return renderTeam();
  ui.team=null;
  ({standings:renderStandings,teams:renderTeams,matches:renderMatches})[ui.tab]();
}
function badge(t){const d=t.doc;return`<span class="dot" style="background:${colorOf(d)}"></span>`}
function renderStandings(){
  if(!teams.length){$('#view').innerHTML='<div class="empty">Todavía no hay equipos inscritos.</div>';return}
  const rows=teams.map(t=>{const x=totals(t.doc);return{t,x,tdd:x.tdFor-x.tdAgainst,cas:x.casFor-x.casAgainst}})
    .sort((a,b)=>b.x.points-a.x.points||b.tdd-a.tdd||b.cas-a.cas||b.x.tdFor-a.x.tdFor||a.t.name.localeCompare(b.t.name,'es'));
  $('#view').innerHTML=`<div class="tscroll"><table><thead><tr><th>#</th><th class="l">Equipo</th><th>Pts</th><th>J</th><th>G</th><th>E</th><th>P</th><th>TD+</th><th>TD−</th><th>Dif</th><th>HER+</th><th>HER−</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td class="l"><a href="#team=${encodeURIComponent(r.t.file)}">${badge(r.t)}<strong>${esc(r.t.name)}</strong></a><br><span class="race">${esc(r.t.doc.race||'')}</span></td>
   <td class="num"><strong>${r.x.points}</strong></td><td class="num">${r.x.played}</td><td class="num">${r.x.won}</td><td class="num">${r.x.drawn}</td><td class="num">${r.x.lost}</td>
   <td class="num">${r.x.tdFor}</td><td class="num">${r.x.tdAgainst}</td><td class="num">${sgn(r.tdd)}</td><td class="num">${r.x.casFor}</td><td class="num">${r.x.casAgainst}</td></tr>`).join('')}
  </tbody></table></div><p class="hint">Desempate: puntos, diferencia de TD, diferencia de heridas y TD a favor. HER = heridas leves + graves + muertes causadas.</p>`;
}
function renderTeams(){
  if(!teams.length){$('#view').innerHTML='<div class="empty">Todavía no hay equipos inscritos.</div>';return}

    <h3><a href="#team=${encodeURIComponent(t.file)}">${esc(t.name)}</a></h3>
    <div class="race">${esc(t.doc.race||'')}</div>
    <div class="meta">${t.doc.league.coach?'Entrenador: '+esc(t.doc.league.coach)+' · ':''}${t.doc.players.length} jugadores · Valor ${fmt(e.teamValue)} · ${e.t.played} partidos jugados</div>

}
function allMatches(){
  const seen=new Set(),out=[];
  for(const t of teams)for(const m of t.doc.league.matches){
    const pair=[t.name,m.opponent.teamName].sort().join('|'),key=m.id+'|'+pair;
    if(seen.has(key)&&m.homeAway!=='home')continue;
    if(seen.has(key)){const i=out.findIndex(o=>o.key===key);if(i>=0)out.splice(i,1)}
    seen.add(key);
    const home=m.homeAway==='away'?{name:m.opponent.teamName,score:m.result.opponentScore,file:null}:{name:t.name,score:m.result.teamScore,file:t.file};
    const away=m.homeAway==='away'?{name:t.name,score:m.result.teamScore,file:t.file}:{name:m.opponent.teamName,score:m.result.opponentScore,file:null};
    out.push({key,id:m.id,round:m.round||0,home,away,team:t,m});
  }
  return out.sort((a,b)=>b.round-a.round||a.id.localeCompare(b.id));
}
function renderMatches(){
  const ms=allMatches();
  if(!ms.length){$('#view').innerHTML='<div class="empty">Todavía no se ha jugado ningún partido.</div>';return}
  const link=(x)=>{const t=teams.find(q=>q.name===x.name);return t?`<a href="#team=${encodeURIComponent(t.file)}">${esc(x.name)}</a>`:esc(x.name)};
  let last=null,html='';
  for(const o of ms){
    if(o.round!==last){html+=`${last!==null?'</div>':''}<h2 class="round">Jornada ${o.round||'—'}</h2><div class="cards">`;last=o.round}
    html+=`<div class="card"><h3>${link(o.home)} <span class="res">${o.home.score} - ${o.away.score}</span> ${link(o.away)} <span class="race" style="font-size:13px">${esc(o.id)}</span></h3></div>`;
  }
  $('#view').innerHTML=html+'</div>';
}

  const rows=d.players.map(p=>{const l=lp(p.num),s=l.statistics||{},out=l.status==='missNextGame';
    const gained=new Set((l.progression.improvements||[]).filter(i=>i.skill).map(i=>normTxt(i.skill)));
    const sk=(p.skills||[]).map(k=>gained.has(normTxt(k))?`<span class="newsk">${esc(k)}</span>`:esc(k)).join(', ');
    return`<tr class="${out?'out':''}"><td class="num">${esc(p.num)}</td><td class="l"><strong>${esc(p.name)}</strong><br><span class="race">${esc(p.position)}</span></td>

  $('#tpanel').innerHTML=`<div class="tscroll"><table><thead><tr><th>#</th><th class="l">Jugador</th><th>MO</th><th>FU</th><th>AG</th><th>PA</th><th>AR</th><th class="l">Habilidades</th>${STAT_COLS.map(([,t])=>`<th>${t}</th>`).join('')}<th>SPP tot / libres</th><th>Valor</th><th>Estado</th><th>Draft</th></tr></thead><tbody>${rows}</tbody></table></div>

/* =========================================================
   Hoja de partido en PDF (formato de la hoja de roster del Excel)
   Necesita: DEFAULT_PRICES, fmt, colorOf-like (se calcula aquí). e = resultado de economy().
   ========================================================= */
async function ensureJsPDF(){
  if(window.jspdf) return window.jspdf.jsPDF;
  await new Promise((ok,ko)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar la librería de PDF (¿sin conexión?).'));
    document.head.appendChild(s);
  });
  return window.jspdf.jsPDF;
}
/* la clave del jugador es la habilidad con forma «Línea - Orc» */
function sheetSplitSkills(p){
  const sk=(p.skills||[]).slice(); let i=-1;
  sk.forEach((k,ix)=>{ if(/\s-\s/.test(k)) i=ix; });
  if(i<0) return {key:'',rest:sk};
  return {key:sk[i],rest:sk.filter((_,ix)=>ix!==i)};
}
async function makeSheetPdf(d,e){
  const JsPDF=await ensureJsPDF();
  const pdf=new JsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const l=d.league, pr=Object.assign({},DEFAULT_PRICES,(l.economy||{}).prices), s=l.staff||{};
  const rr=(d.staff&&d.staff.rerolls)||{count:0,pricePerUnit:100000};
  const M=6, DK=[77,77,77], GR=[217,217,217], BL=[220,230,242], ORG=[255,226,196], BK=[0,0,0], WH=[255,255,255];
  const hex=/^#[0-9a-f]{6}$/i.test(d.color||'')?d.color:'#b30000';
  const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  const ink=d.textColor&&d.textColor!=='auto'?d.textColor:((rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000>=150?'#111111':'#ffffff');
  const inkRgb=/^#[0-9a-f]{6}$/i.test(ink)?[1,3,5].map(i=>parseInt(ink.slice(i,i+2),16)):WH;
  pdf.setLineWidth(.2); pdf.setDrawColor(110,110,110);

  function cell(x,y,w,h,o={}){
    const {fill,text='',size=7,bold=false,align='center',color=BK,max=0}=o;
    if(fill){ pdf.setFillColor(...fill); pdf.rect(x,y,w,h,'FD'); } else pdf.rect(x,y,w,h,'S');
    if(text===''||text===null||text===undefined) return;
    pdf.setFont('helvetica',bold?'bold':'normal'); pdf.setTextColor(...color);
    let sz=size, lines;
    for(;;){
      pdf.setFontSize(sz);
      lines=pdf.splitTextToSize(String(text),w-1.6);
      const lh=sz*0.3528*1.15;
      if(lines.length*lh<=h-0.6 || sz<=4.5) break;
      sz-=0.5;
    }
    const lh=sz*0.3528*1.15, tx=align==='left'?x+0.9:x+w/2;
    lines.forEach((t,i)=>pdf.text(t,tx,y+h/2+(i-(lines.length-1)/2)*lh,{align:align==='left'?'left':'center',baseline:'middle'}));
  }

  /* cabecera */
  let y=M;
  pdf.setFillColor(...rgb); pdf.rect(M,y,285,8,'F');
  pdf.setTextColor(...inkRgb); pdf.setFont('helvetica','bold'); pdf.setFontSize(12);
  pdf.text(String(d.teamName||'').toUpperCase(),M+3,y+5.4,{baseline:'alphabetic'});
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
  pdf.text(`${d.race||''}  ·  Temporada ${l.season||''}`,M+3+pdf.getTextWidth(String(d.teamName||'').toUpperCase())*1.45+6,y+5.2);
  pdf.text('Jornada: ____   Rival: ______________________   Resultado: ____ - ____',M+285-3,y+5.2,{align:'right'});
  y+=10;

  /* tabla de jugadores */
  const cols=[['#',6],['NOMBRE JUGADOR',32],['TIPO',22],['MO',6.5],['FU',6.5],['AG',6.5],['PA',6.5],['AR',6.5],
    ['HABILIDADES',46],['CLAVE JUGADOR',24],['LPP /RT',8],['ESP',6.5],['CP',6.5],['TD',6.5],['DES',6.5],['INT',6.5],
    ['HL',6.5],['HG',6.5],['RIP',6.5],['MVP',6.5],['SPP Totales',12],['SPP Sin gastar',12],['PRECIO',15],['SUB',8],['DRAFT',8]];
  const xs=[]; let acc=M; cols.forEach(c=>{ xs.push(acc); acc+=c[1]; });
  cols.forEach((c,i)=>cell(xs[i],y,c[1],8,{fill:DK,text:c[0],size:i===9||i===20||i===21||i===24?5.2:6,bold:true,color:WH}));
  y+=8;
  const n=Math.max(11,d.players.length), rowH=Math.min(10.2,112/n);
  const lpOf=num=>l.players.find(p=>p.num===num);
  for(let r=0;r<n;r++){
    const p=d.players[r], lp=p&&lpOf(p.num);
    if(!p){
      cols.forEach((c,i)=>cell(xs[i],y,c[1],rowH,{fill:i===0?DK:(i===23?GR:(i===24?BL:null)),text:i===0?String(r+1):'',color:WH,bold:true,size:6.5}));
      y+=rowH; continue;
    }
    const {key,rest}=sheetSplitSkills(p);
    const prog=(lp&&lp.progression)||{}, imps=(prog.improvements||[]);
    const skillsUp=imps.filter(i=>i.skill).length;
    const price=((lp&&lp.price)||0)+imps.concat(prog.draftPayments||[]).reduce((a,i)=>a+(i.valueExtra||0),0);
    const out=lp&&lp.status==='missNextGame';
    const vals=[String(p.num),null,p.position,p.ma,p.st,p.ag,p.pa,p.av,rest.join(', '),key,out?'SÍ':'','','','','','','','','',
      '',String(prog.sppTotal||0),String(prog.sppUnspent||0),fmt(price),'',skillsUp?`${skillsUp+1}+`:''];
    cols.forEach((c,i)=>{
      const o={text:vals[i]??'',size:7}; if(out&&i>0) o.fill=ORG;
      if(i===0){ o.fill=DK; o.color=WH; o.bold=true; }
      if(i===1){ o.text=p.name; o.align='left'; o.bold=true; o.size=7.5; }
      if(i===2||i===8||i===9){ o.align='left'; o.size=6.5; }
      if(i===9){ o.bold=true; }
      if(i===20||i===21){ o.bold=true; o.size=8; }
      if(i===22){ o.align='center'; o.size=7; }
      if(i===23&&!out){ o.fill=GR; }
      if(i===24){ if(!out) o.fill=BL; o.bold=true; o.size=9; }
      if(i===10){ o.bold=true; o.size=7.5; }
      cell(xs[i],y,c[1],rowH,o);
    });
    y+=rowH;
  }
  y+=2.5;

  /* bloque inferior */
  const RH=5.2, k=v=>fmt(Math.round(v/1000))+' k mo';
  const left=[['ENTRENADOR',l.coach||''],['RAZA',d.race||''],['NOMBRE DEL EQUIPO',d.teamName||''],['IDIOMA','Español'],
    ['COSTE INCENTIVOS Y EXTRAS',k(e.staffCost+e.rerolls)],['PRECIO JUGADORES',k(e.playersBase+e.playersExtra)],
    ['PRECIO TOTAL EQUIPO',k(e.teamCost)],['TESORERÍA',k(e.treasury)],['VALOR DEL EQUIPO',k(e.teamValue)]];
  left.forEach(([lab,val],i)=>{ cell(M,y+i*RH,46,RH,{fill:DK,text:lab,color:WH,bold:true,size:6}); cell(M+46,y+i*RH,28,RH,{text:val,size:7.5,bold:true}); });

  const money=v=>fmt(v);
  const fansCost=Math.max(0,(s.dedicatedFans||1)-1)*pr.dedicatedFan;
  const mid=[['FANS',null],
    ['FANS DEVOTOS',[e.fans,pr.dedicatedFan,fansCost]],
    ['MÉDICO',[s.apothecary||0,pr.apothecary||'',(s.apothecary||0)*(pr.apothecary||0)]],
    ['ANIMADORAS',[s.cheerleaders||0,pr.cheerleader,(s.cheerleaders||0)*pr.cheerleader]],
    ['AYUDANTES ENTRENADOR',[s.assistantCoaches||0,pr.assistantCoach,(s.assistantCoaches||0)*pr.assistantCoach]],
    ['SOBORNOS',[s.bribes||0,pr.bribe,(s.bribes||0)*pr.bribe]],
    ['MASTER CHEF',[0,300000,0]],
    ['NOVATOS ALBOROTADORES',null]];
  const right=[['SEGUNDAS OPORTUNIDADES TOTALES',[rr.count||0,rr.pricePerUnit||100000,e.rerolls]],
    ['ENTRENAMIENTO EXTRA',[0,150000,0]],['BARRILES BLOODWEISER',[0,50000,0]],['ANIMADORAS TEMP.',[0,30000,0]],
    ['AYUDANTES ENTRENADOR T.P.',[0,30000,0]],['MEDIDAS DESESPERADAS',[0,50000,0]],['JUGADAS ESPECIALES',[0,100000,0]],
    ['MÉDICO ERRANTE',null]];
  function block(x0,labW,rows){
    rows.forEach(([lab,v],i)=>{
      const yy=y+i*RH;
      cell(x0,yy,labW,RH,{fill:DK,text:lab,color:WH,bold:true,size:5.8});
      let x=x0+labW;
      if(v===null){ cell(x,yy,9+5+17+6+14,RH,{}); return; }
      cell(x,yy,9,RH,{text:String(v[0]),size:7.5,bold:true}); x+=9;
      cell(x,yy,5,RH,{text:'x',size:6.5}); x+=5;
      cell(x,yy,17,RH,{text:v[1]===''?'':money(v[1]),size:7}); x+=17;
      cell(x,yy,6,RH,{text:'mo',size:6}); x+=6;
      cell(x,yy,14,RH,{fill:GR,text:money(v[2]),size:7.5,bold:true});
    });
  }
  block(M+74+3,40,mid);
  block(M+74+3+40+51+3,52,right);

  /* leyenda */
  pdf.setTextColor(...BK); pdf.setFont('helvetica','normal'); pdf.setFontSize(5.7);
  const ly=y+9*RH+4.5;
  pdf.text('LPP/RT= SÍ: el jugador se pierde el próximo partido (fila naranja)   ESP=(1)   CP=PASE COMPLETADO (1)   TD=TOUCHDOWN (3)   DES=PASE DESVIADO (1)   INT=INTERCEPCIÓN (2)   HL=HERIDA LEVE (2)   HG=HERIDA GRAVE (2)   RIP=MUERTOS (2)   MVP=MEJOR DEL PARTIDO (4)',M,ly);
  pdf.text('DRAFT: aparece «2+» si el jugador ha subido 1 habilidad con SPP, «3+» si ha subido 2, y así sucesivamente (las habilidades de base no cuentan). Los eventos del partido se anotan en las columnas ESP a MVP y se pasan después al gestor.',M,ly+3.6);
  return pdf;
}
async function downloadSheet(d,e,base){
  try{
    const pdf=await makeSheetPdf(d,e);
    pdf.save(`${base}_hoja_partido.pdf`);
  }catch(err){ toast(err.message||'No se pudo crear el PDF.'); }
}

/* ---------- navegación ---------- */
function fromHash(){const m=/team=([^&]+)/.exec(location.hash);ui.team=m?decodeURIComponent(m[1]):null;if(ui.team)ui.teamTab=ui.teamTab||'roster'}
window.addEventListener('hashchange',()=>{fromHash();if(!ui.team)document.documentElement.style.removeProperty('--accent'),document.documentElement.style.removeProperty('--accent-ink');render()});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.main){ui.tab=b.dataset.main;ui.team=null;document.documentElement.style.removeProperty('--accent');document.documentElement.style.removeProperty('--accent-ink');history.replaceState(null,'',location.pathname+location.search);render()}
  else if(b.dataset.tt){ui.teamTab=b.dataset.tt;render()}
  else if(b.dataset.dl){downloadTeam(b.dataset.dl)}
  else if(b.dataset.sheet){const t=teams.find(x=>x.file===b.dataset.sheet);if(t)downloadSheet(t.doc,economy(t.doc),t.file.replace(/\.json$/i,''))}
  else if(b.hasAttribute('data-back')){e.preventDefault();history.replaceState(null,'',location.pathname+location.search);ui.team=null;document.documentElement.style.removeProperty('--accent');document.documentElement.style.removeProperty('--accent-ink');render()}
});
$('#reloadBtn').onclick=loadAll;$('#zipBtn').onclick=downloadZip;
loadAll();
</script>
